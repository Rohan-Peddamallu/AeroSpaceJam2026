<!DOCTYPE html>
<html>
<head>
    <title>Aerospace Jam Example</title>
    <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
</head>
<body>
    <h1>Aerospace Jam Example</h1>
    <p><b>Random number chosen by the Pi: </b> <span id="randomNumber">Loading...</span></p>
    <p><b>Barometric Pressure: </b> <span id="barometricPressure">Loading...</span> hPa</p>
    <p><b>Accelerometer (m/s&sup2;): </b> X: <span id="accel_x">Loading...</span> Y: <span id="accel_y">Loading...</span> Z: <span id="accel_z">Loading...</span></p>
    <p><b>Gyroscope (&deg;/s): </b> X: <span id="gyro_x">Loading...</span> Y: <span id="gyro_y">Loading...</span> Z: <span id="gyro_z">Loading...</span></p>
    <button id="doAThingButton">Click me to do a thing on the server!</button>
    <hr>
    <h2>Motor</h2>
    <button id="motorForwardButton">Forward</button>
    <button id="motorBackwardButton">Backward</button>
    <button id="motorStopButton">Stop</button>
    <hr>
    <h2>Camera</h2>
    <button id="takePictureButton">Take Picture</button>
    <br>
    <img id="cameraImage" src="" alt="Live from Pi!" style="width: 640px; height: 480px; border: 1px solid black;">

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var socket = io.connect('http://' + document.domain + ':' + location.port);
            socket.on('update_data', function(msg) {
                var randomNumberSpan = document.getElementById('randomNumber');
                randomNumberSpan.textContent = msg.randomNumber;
                var barometricPressureSpan = document.getElementById('barometricPressure');
                barometricPressureSpan.textContent = msg.barometricPressure;
                document.getElementById('accel_x').textContent = msg.accel_x.toFixed(2);
                document.getElementById('accel_y').textContent = msg.accel_y.toFixed(2);
                document.getElementById('accel_z').textContent = msg.accel_z.toFixed(2);
                document.getElementById('gyro_x').textContent = msg.gyro_x.toFixed(2);
                document.getElementById('gyro_y').textContent = msg.gyro_y.toFixed(2);
                document.getElementById('gyro_z').textContent = msg.gyro_z.toFixed(2);
            });
            var doAThingButton = document.getElementById('doAThingButton');
            doAThingButton.addEventListener('click', function() {
                socket.emit('do_a_thing', { hello: 'Hello, Aerospace Jam! This is a message being sent from the client to the server.' });
            });

            var motorForwardButton = document.getElementById('motorForwardButton');
            motorForwardButton.addEventListener('click', function() { socket.emit('motor_forward'); });
            var motorBackwardButton = document.getElementById('motorBackwardButton');
            motorBackwardButton.addEventListener('click', function() { socket.emit('motor_backward'); });
            var motorStopButton = document.getElementById('motorStopButton');
            motorStopButton.addEventListener('click', function() { socket.emit('motor_stop'); });

            var takePictureButton = document.getElementById('takePictureButton');
            var cameraImage = document.getElementById('cameraImage');
            takePictureButton.addEventListener('click', function() {
                console.log('Requesting image from server...');
                socket.emit('request_image');
            });
            socket.on('new_image', function(msg) {
                console.log('Received new image!');
                cameraImage.src = 'data:image/jpeg;base64,' + msg.image_data;
            });
        });
    </script>
</body>
</html>
